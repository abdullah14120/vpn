name: Build and Sign APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # توليد الـ Wrapper لضمان وجود المحرك الصحيح
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2

      # --- فك التشفير بالطريقة الاحترافية (تجنب تلف الملف) ---
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode --ignore-garbage > app/nasa_new.jks

      # خطوة فحص الملف (ستظهر في اللوج إذا كان حجمه منطقياً)
      - name: Verify Keystore Integrity
        run: |
          ls -lh app/nasa_new.jks
          file app/nasa_new.jks

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # بناء نسخة الـ Release
      - name: Build Signed Release APK
        run: ./gradlew assembleRelease
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AB-Shield-Release
          path: app/build/outputs/apk/release/*.apk
