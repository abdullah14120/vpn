name: Build and Sign APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # توليد الـ Wrapper لضمان استقرار الإصدار
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2

      # --- الحل الجذري: استخدام بايثون لضمان فك التشفير بدون تلف ---
      - name: Prepare Keystore (Secure Python Method)
        shell: python
        run: |
          import base64
          import os

          # جلب النص من GitHub Secrets
          encoded_keystore = """${{ secrets.KEYSTORE_BASE64 }}"""
          
          try:
              # فك التشفير وتحويله إلى بايتات خام
              decoded_data = base64.b64decode(encoded_keystore.strip())
              
              # التأكد من وجود مجلد app
              if not os.path.exists("app"):
                  os.makedirs("app")
                  
              # كتابة الملف الثنائي مباشرة
              with open("app/nasa_new.jks", "wb") as f:
                  f.write(decoded_data)
              print("✅ Keystore file created successfully without corruption.")
          except Exception as e:
              print(f"❌ Error decoding keystore: {str(e)}")
              exit(1)

      - name: Verify Keystore Integrity
        run: |
          ls -lh app/nasa_alias.jks
          # التأكد أن الملف ليس فارغاً
          if [ ! -s app/nasa_new.jks ]; then echo "File is empty!"; exit 1; fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # بناء نسخة الـ Release الموقعة
      - name: Build Signed Release APK
        run: ./gradlew assembleRelease
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AB-Shield-Release
          path: app/build/outputs/apk/release/*.apk
