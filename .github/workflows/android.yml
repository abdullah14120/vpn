name: Build and Sign APK

on:
  push:
    branches: [ "main" ] # أو اسم الفرع الرئيسي لديك

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # خطوة فك تشفير ملف التوقيع من الـ Secrets
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/nasa_new.jks

      # بناء نسخة الـ Release الموقعة
      - name: Build Signed Release APK
        run: ./gradlew assembleRelease
        env:
          # ربط المتغيرات التي سيقرأها ملف build.gradle
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # رفع الملف النهائي كـ Artifact
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AB-Shield-Release
          path: app/build/outputs/apk/release/*.apk
